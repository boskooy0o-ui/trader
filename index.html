<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ollama Studio</title>
<style>
:root{--bg:#0c0f1d;--tx:#e9ecff;--mut:#8e97ba;--ac:#5eead4;--am:#fbbf24;--rd:#f87171;--gr:#4ade80}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 "Trebuchet MS",system-ui,sans-serif;display:grid;grid-template-columns:330px 1fr;gap:22px;padding:22px;background:radial-gradient(620px 420px at 12% 8%,#4c2fb866,transparent),radial-gradient(720px 520px at 92% 85%,#0e7c7466,transparent),var(--bg)}
aside,main{min-width:0}
aside{display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px;font-weight:700}h2{margin:18px 0 10px;font-size:16px}
label,select,textarea,button{font:inherit;color:inherit}
textarea,select{width:100%;background:#ffffff0f;border:1px solid #ffffff2a;border-radius:12px;padding:10px;color:var(--tx)}
textarea{height:300px;resize:vertical}
select option{color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #ffffff33;background:#ffffff14;padding:9px 14px;border-radius:12px;cursor:pointer}
.btn:hover{background:#ffffff26}.btn.p{background:var(--ac);color:#06201c;border-color:var(--ac);font-weight:700}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;background:#ffffff12;width:fit-content}
.chip.on{color:var(--gr)}.chip.off{color:var(--rd)}
#st{padding:10px 12px;border-radius:12px;background:#ffffff0d;min-height:44px;color:var(--mut)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding-top:34px}
.empty{color:var(--mut);grid-column:1/-1}
.b{position:relative;min-height:104px;padding:16px;border-radius:26px;background:#ffffff12;backdrop-filter:blur(14px);border:1px solid #ffffff2e;display:flex;flex-direction:column;gap:4px;transition:opacity .2s,border-color .2s}
.b small{color:var(--mut);font-size:12.5px}
.dot{position:absolute;top:14px;right:16px;width:10px;height:10px;border-radius:50%;background:#ffffff40}
.working{border-color:var(--ac);animation:pulse 1.5s infinite}.working .dot{background:var(--ac)}
.debug{border-color:var(--am)}.debug .dot{background:var(--am)}
.done{border-color:#4ade8088}.done .dot{background:var(--gr)}
.fail{border-color:var(--rd)}.fail .dot{background:var(--rd)}
.queued{opacity:.6}
.sug{opacity:.5;border:1px dashed #ffffff66;background:#ffffff08}.sug:hover{opacity:.95}
.tip{position:absolute;left:6px;right:6px;bottom:calc(100% + 8px);background:#05070ff2;border:1px solid #ffffff2a;border-radius:14px;padding:9px 11px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.b:hover .tip{opacity:1}
.act{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.act button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;font-size:15px;font-weight:700}
.act button[data-a=y]{background:var(--gr);color:#052e16}.act button[data-a=n]{background:var(--rd);color:#450a0a}
#log{margin:0;max-height:280px;overflow:auto;background:#00000055;border-radius:14px;padding:12px;font:12.5px/1.4 Consolas,monospace;white-space:pre-wrap;color:#c8d0f5}
@keyframes pulse{50%{box-shadow:0 0 0 6px #5eead422}}
@media(max-width:820px){body{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.working{animation:none}}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<aside>
<h1>Ollama Studio</h1>
<div id="chip" class="chip off">Studio plugin: nije povezan</div>
<select id="model"></select>
<textarea id="prompt" placeholder="Nalepi instrukciju ovde…"></textarea>
<label><input type="checkbox" id="forever"> Run forever (sam smišlja šta dalje)</label>
<label><input type="checkbox" id="pt" checked> Playtest + auto-debug preko plugina</label>
<div class="row"><button class="btn p" id="go">Start</button><button class="btn" id="stop">Stop</button><button class="btn" id="sg">Sugestije</button></div>
<div id="st">Spreman.</div>
</aside>
<main>
<h2>Šta se pravi (pređi mišem za info)</h2>
<div id="grid"><div class="empty">Još ništa. Nalepi instrukciju i klikni Start.</div></div>
<h2>Kod i log</h2>
<pre id="log"></pre>
</main>
<script>
const $=s=>document.querySelector(s);
let tasks=[],sugs=[],running=false,stop=false,plugin=false,goal='',rules='',n=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=t=>{const l=$('#log');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight};
const st=t=>$('#st').textContent=t;
const lab={queued:'čeka',working:'piše kod…',debug:'debuguje…',done:'gotovo',fail:'ne radi',sug:'sugestija'};

function draw(){
 const bub=t=>`<div class="b ${t.status}"><i class="dot"></i><b>${esc(t.name)}</b><small>${t.cls?esc(t.cls)+' u '+esc(t.path):'predlog'}</small><small>${lab[t.status]}</small><div class="tip">${esc(t.info)}${t.note?'<br>Greška: '+esc(t.note):''}</div>${t.status==='sug'?`<div class="act"><button data-a="y" data-id="${t.id}" title="Prihvati">✓</button><button data-a="n" data-id="${t.id}" title="Odbij">✕</button></div>`:''}</div>`;
 const all=[...tasks,...sugs];
 $('#grid').innerHTML=all.length?all.map(bub).join(''):'<div class="empty">Još ništa. Nalepi instrukciju i klikni Start.</div>';
}
$('#grid').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;
 const s=sugs.find(x=>x.id==b.dataset.id);if(!s)return;
 sugs=sugs.filter(x=>x!==s);
 if(b.dataset.a==='y'){tasks.push(mk(s.name,...guess(s.name),s.info));loop()}
 draw()};

const guess=(name,info='')=>/gui|ui\b|popup|hud|screen|banner|menu/i.test(name+info)?['LocalScript','StarterPlayer/StarterPlayerScripts']:['Script','ServerScriptService'];
const mk=(name,cls,path,info,req)=>({id:++n,name,cls,path,info:info.slice(0,170),req:req||info,status:'queued',code:''});
const PM={StarterPlayerScripts:'StarterPlayer/StarterPlayerScripts'};

function plan(text){
 const re=/\(\s*(ModuleScript|LocalScript|Script)\s+in\s+([\w ]+?)\s*->\s*(\w+)\s*\)/g;let m,hits=[];
 while((m=re.exec(text)))hits.push({m,ls:Math.max(0,text.lastIndexOf('\n',m.index))});
 return hits.map((h,i)=>{
  const end=i+1<hits.length?hits[i+1].ls:text.length;
  const req=text.slice(h.ls,end).split(/\n\s*#{2,}/)[0].replace(/\s+/g,' ').trim().slice(0,900);
  const p=h.m[2].replace(/\s/g,'');
  return mk(h.m[3],h.m[1],PM[p]||p,req,req)});
}
async function planAI(text){
 const r=await ask('Reply only with lines "Name: one sentence". No other text.','List 3 to 6 Roblox scripts needed for:\n'+text.slice(0,1500));
 return parse(r,6).map(x=>mk(x.name,...guess(x.name,x.info),x.info));
}
const parse=(r,max)=>r.split('\n').map(l=>l.match(/^[\d.\-*\s]*\**([A-Za-z][\w ]{1,28}?)\**\s*:\s*(.{5,})$/)).filter(Boolean).slice(0,max).map(m=>({id:++n,name:m[1].replace(/\s+/g,''),info:m[2].trim(),status:'sug'}));

async function ask(system,user){
 const r=await fetch('/api/chat',{method:'POST',body:JSON.stringify({model:$('#model').value,stream:false,options:{num_ctx:4096,num_predict:1800,temperature:.3},messages:[{role:'system',content:system},{role:'user',content:user}]})});
 const j=await r.json();if(j.error)throw new Error(j.error);return j.message.content}
const cmd=b=>fetch('/api/cmd',{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
const extract=r=>{const m=/```(?:lua|luau)?\s*\n([\s\S]*?)```/.exec(r)||/```(?:lua|luau)?\s*\n([\s\S]*)$/.exec(r);return(m?m[1]:r).trim()};
const SYS='You are an expert Roblox Luau developer. Reply with exactly ONE ```lua code block, complete and working, no comments, --!strict, task.wait, type annotations.';

async function put(t){
 if(!plugin){log('(plugin nije povezan, kopiraj kod iz loga)');return}
 const r=await cmd({type:'write',path:t.path,name:t.name,class:t.cls,source:t.code});log(r.output)}

async function build(t){
 t.status='working';draw();st('Trenutno piše: '+t.name+' ('+t.cls+')');
 const have=tasks.filter(x=>x.code).map(x=>x.name).join(', ')||'none';
 t.code=extract(await ask(SYS,`Game: ${goal}\n${rules}\nExisting scripts: ${have}. Share data through RemoteEvents in ReplicatedStorage (server creates them, client uses WaitForChild).\nWrite the ${t.cls} named ${t.name} placed in ${t.path}.\nRequirements: ${t.req}`));
 log(`--- ${t.name}\n${t.code}\n`);
 await put(t);
 if($('#pt').checked&&plugin){
  for(let i=0;!stop;i++){
   st('Playtest: '+t.name);const r=await cmd({type:'playtest',seconds:8});const err=(r.output||'').trim();
   if(!err||!r.ok)break;
   log('Greške:\n'+err);
   if(i>=2){t.status='fail';t.note=err.slice(0,140);draw();return}
   t.status='debug';draw();st('Debuguje: '+t.name+' ('+(i+1)+'/2)');
   t.code=extract(await ask(SYS,`This ${t.cls} named ${t.name} threw:\n${err.slice(0,600)}\nCode:\n${t.code.slice(0,4000)}\nReturn the full fixed script.`));
   await put(t);
  }
 }
 t.status='done';draw()}

async function suggest(){
 st('Smišlja sugestije…');
 const r=await ask('Reply only with 3 lines "Name: one short sentence". No other text.',`Game: ${goal}\nAlready built: ${tasks.map(x=>x.name).join(', ')}.\nSuggest 3 next features.`);
 const have=tasks.map(x=>x.name.toLowerCase());
 sugs=parse(r,3).filter(s=>!have.includes(s.name.toLowerCase()));draw()}

async function loop(){
 if(running)return;running=true;stop=false;
 try{
  while(!stop){
   const t=tasks.find(x=>x.status==='queued');
   if(t){await build(t);continue}
   if(!sugs.length)await suggest();
   if($('#forever').checked&&sugs.length){const s=sugs.shift();tasks.push(mk(s.name,...guess(s.name,s.info),s.info));sugs=[];draw();continue}
   st('Gotovo ✔ Šta dalje? Potvrdi sugestiju (✓) ili upiši novi zadatak.');break}
  if(stop)st('Zaustavljeno.');
 }catch(e){st('Greška: '+e.message);log('GREŠKA: '+e.message)}
 running=false}

$('#go').onclick=async()=>{
 const text=$('#prompt').value.trim();if(!text)return;
 if(!tasks.length){goal=text.replace(/\s+/g,' ').slice(0,300);rules=(text.match(/Coding Guidelines[\s\S]*/i)||[''])[0].replace(/\s+/g,' ').slice(0,600)}
 try{st('Pravim plan…');let p=plan(text);if(!p.length)p=await planAI(text);
  tasks.push(...p.filter(x=>!tasks.some(y=>y.name===x.name)));draw();loop()}
 catch(e){st('Greška: '+e.message)}};
$('#stop').onclick=()=>{stop=true;st('Staje posle trenutnog koraka…')};
$('#sg').onclick=()=>suggest().then(()=>st('Sugestije spremne.')).catch(e=>st('Greška: '+e.message));

async function init(){
 try{const j=await(await fetch('/api/tags')).json();const ms=j.models.map(m=>m.name);
  $('#model').innerHTML=ms.map(m=>`<option>${esc(m)}</option>`).join('');
  $('#model').value=ms.find(m=>/qwen2\.5.*3b/i.test(m))||ms[0]}
 catch(e){st('Ollama nije dostupan na localhost:11434. Pokreni ga.')}}
setInterval(async()=>{try{plugin=(await(await fetch('/api/status')).json()).plugin}catch(e){plugin=false}
 const c=$('#chip');c.className='chip '+(plugin?'on':'off');c.textContent='Studio plugin: '+(plugin?'povezan':'nije povezan')},3000);
init();
</script></body></html>
